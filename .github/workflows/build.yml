name: Build and verify public Minyra preview

on:
  push:
    branches: [main, ci/private-core-compatibility-20261104]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public icon generator
        run: python3 -m pip install --quiet 'Pillow==11.3.0'
      - name: Build and run offline agent verification
        run: bash Scripts/build_public.sh
      - name: Check private GUI installer AppleScript syntax
        shell: bash
        run: |
          printf '%s\n' \
            'on run argv' \
            '    set cmdPath to item 1 of argv' \
            '    set sourceApp to item 2 of argv' \
            '    set cmdText to "/bin/bash " & quoted form of cmdPath & " " & quoted form of sourceApp' \
            '    do shell script cmdText with administrator privileges' \
            'end run' > "$RUNNER_TEMP/minyra-install.applescript"
          osacompile -o "$RUNNER_TEMP/minyra-install.scpt" "$RUNNER_TEMP/minyra-install.applescript"
          printf '%s\n' 'display dialog "安装 Minyra for Mac 1.0.1：将先自动测试，再替换 /Applications 中的旧版。" buttons {"取消", "开始安装"} default button "开始安装" cancel button "取消" with icon note' > "$RUNNER_TEMP/minyra-dialog.applescript"
          osacompile -o "$RUNNER_TEMP/minyra-dialog.scpt" "$RUNNER_TEMP/minyra-dialog.applescript"
          echo "PRIVATE_GUI_INSTALLER_APPLESCRIPT_SYNTAX_PASS"
      - name: Compile repaired private installer dialogs on macOS
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/minyra-repair-error.applescript" <<'OSA'
          on run argv
              set reasonText to item 1 of argv
              set details to item 2 of argv
              set logPath to item 3 of argv
              try
                  set answer to display dialog "Mini 酱暂未安装，原版保持不变。" & return & return & "原因：" & reasonText & return & return & "最近的检查结果：" & return & details buttons {"关闭", "查看详细日志"} default button "查看详细日志" with icon caution giving up after 300
                  if button returned of answer is "查看详细日志" then
                      do shell script "/usr/bin/open -a TextEdit " & quoted form of logPath
                  end if
              end try
          end run
          OSA
          cat > "$RUNNER_TEMP/minyra-repair-start.applescript" <<'OSA'
          try
              display dialog "修复安装 Minyra for Mac 1.0.1" & return & return & "• 自动修复签名与下载隔离属性" & return & "• 自动运行本机自检和真实子进程测试" & return & "• 通过后直接替换 /Applications 中的旧版" & return & "• 不保留旧版安装备份，项目资料不会主动清除" buttons {"取消", "开始安装"} default button "开始安装" cancel button "取消" with icon note
          on error number -128
              error number -128
          end try
          OSA
          for x in "$RUNNER_TEMP"/minyra-repair-*.applescript; do
            osacompile -o "${x%.applescript}.scpt" "$x"
          done
          echo "REPAIR_INSTALLER_GUI_APPLESCRIPT_COMPILE_OK"
      - name: Package unsigned Intel preview
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/private-core-compatibility-20261104')
        shell: bash
        run: |
          set -Eeuo pipefail
          APP='build/PublicDerivedData/Build/Products/Release/Minyra for Mac.app'
          test -x "$APP/Contents/MacOS/MiniCodingAgent"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            'dist/Minyra-for-Mac-v1.0.0-preview.1-macos-x86_64.zip'
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
          test -s dist/SHA256SUMS.txt
      - name: Upload public preview package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/private-core-compatibility-20261104')
        uses: actions/upload-artifact@v4
        with:
          name: minyra-macOS-Intel-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish versioned preview (once, after checks pass)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minyra-macOS-Intel-preview
          path: dist
      - name: Publish unsigned prerelease if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.0.0-preview.1
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/SHA256SUMS.txt
          test -s dist/Minyra-for-Mac-v1.0.0-preview.1-macos-x86_64.zip
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing preview release: $RELEASE_TAG (not replacing assets)"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/Minyra-for-Mac-v1.0.0-preview.1-macos-x86_64.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'Minyra for Mac v1.0.0 Preview 1 (unsigned)' \
            --notes-file RELEASE_NOTES.md \
            --prerelease
